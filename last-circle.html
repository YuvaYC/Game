<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Circle – 2D Battle Royale</title>
<style>
:root{--bg:#0f1720;--card:#16212c;--fg:#e8eef5;--ac:#ff5a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#16212c;--fg:#e8eef5}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#16212c;--fg:#e8eef5}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{display:block;cursor:crosshair}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,22,.82);padding:16px}
.card{background:var(--card);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:34px;letter-spacing:2px;color:var(--ac)}
p{margin:6px 0;opacity:.85;font-size:14px;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:12px;margin:14px 0 10px;border-radius:10px;border:1px solid #345;background:#0c141c;color:var(--fg);font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}
kbd{background:#0c141c;border-radius:4px;padding:1px 6px;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"><div class="card">
<h1>LAST CIRCLE</h1>
<p>2D online battle royale · up to 10 players per arena. Loot guns, meds and shields, stay inside the shrinking zone, be the last one standing.</p>
<input id="nm" maxlength="14" placeholder="Your name">
<button id="go">▶ PLAY</button>
<p><kbd>WASD</kbd> move · <kbd>Mouse</kbd> aim &amp; shoot · <kbd>1-4</kbd> weapons · <kbd>H</kbd> use medkit · <kbd>M</kbd> mute<br>You start with a pistol. Walk over loot to pick it up. Best on desktop.</p>
</div></div>
<script>
const W=2400,C=W/2,RL=165000,cv=document.getElementById('c'),g=cv.getContext('2d');
let VW,VH;function rs(){VW=cv.width=innerWidth;VH=cv.height=innerHeight}rs();addEventListener('resize',rs);
const WP={pistol:{d:14,r:.33,s:760,p:1,sp:.04,col:'#ddd',k:'Pistol'},smg:{d:8,r:.085,s:820,p:1,sp:.12,col:'#7cf',k:'SMG'},shotgun:{d:9,r:.85,s:700,p:6,sp:.28,col:'#fa4',k:'Shotgun'},rifle:{d:28,r:.55,s:1100,p:1,sp:.015,col:'#f7a',k:'Rifle'}};
const ORD=['pistol','smg','shotgun','rifle'];
const LS={ammo:['#fc3','A'],med:['#f44','+'],shield:['#4af','S'],smg:['#7cf','SMG'],shotgun:['#fa4','SG'],rifle:['#f7a','AR']};
const POOL=['ammo','ammo','ammo','ammo','ammo','med','med','med','shield','shield','smg','shotgun','rifle'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hitObs=(x,y,r)=>obs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r);
const zoneR=t=>t<15?1700:t>135?150:1700-(t-15)/120*1550;
let obs=[],loot=[],taken=new Set(),RD=-1,me={},others=new Map(),bul=[],feed=[],keys={},mouse={x:0,y:0,d:false};
let room=null,mode='c',arena=0,myPeer=null,cd=0,started=false,pname='',hue=Math.floor(Math.random()*360),lastPres=0;

function gen(r){const q=rng(r*7919+13);obs=[];loot=[];taken.clear();
 for(let i=0;i<70;i++)obs.push({x:q()*W,y:q()*W,r:22+q()*38,t:q()<.6?0:1});
 for(let i=0;i<95;i++){let x,y,n=0;do{x=60+q()*(W-120);y=60+q()*(W-120)}while(hitObs(x,y,30)&&n++<20);loot.push({i,x,y,t:POOL[q()*POOL.length|0]})}}
function reset(){let n=0;do{me.x=100+Math.random()*(W-200);me.y=100+Math.random()*(W-200)}while(hitObs(me.x,me.y,22)&&n++<30);
 Object.assign(me,{hp:100,sh:0,w:'pistol',own:{pistol:1},am:30,med:0,al:true,k:0,a:0});bul=[]}
function mkBots(){for(let i=0;i<5;i++){let x,y;do{x=200+Math.random()*(W-400);y=200+Math.random()*(W-400)}while(hitObs(x,y,24));
 others.set('b'+i,{bot:1,x,y,a:0,hp:100,al:true,n:'Bot '+(i+1),c:i*70+20,w:'pistol',k:0,cd:1+Math.random(),gx:C,gy:C})}}

function spawn(x,y,as,w,o){const p=WP[w];if(!p||!Array.isArray(as))return;if(o==='me')me.fl=performance.now();else{const q=others.get(o);if(q)q.fl=performance.now();snd(w,+x,+y)}
 for(const a of as.slice(0,8)){const an=+a;if(!isFinite(an))continue;bul.push({x:+x,y:+y,vx:Math.cos(an)*p.s,vy:Math.sin(an)*p.s,l:.9,d:p.d,o,w})}}
function shoot(){const p=WP[me.w];cd=p.r;me.am--;snd(me.w);const as=[];for(let i=0;i<p.p;i++)as.push(me.a+(Math.random()-.5)*2*p.sp);
 const x=Math.round(me.x+Math.cos(me.a)*24),y=Math.round(me.y+Math.sin(me.a)*24);spawn(x,y,as,me.w,'me');
 if(room)room.emit('shot',{x,y,as:as.map(v=>+v.toFixed(3)),w:me.w}).catch(()=>{})}
function kill(d){if(room)room.emit('kill',d).catch(()=>{});else onKill(d)}
function onKill(d){feed.push({t:(String(d.kn||'Zone').slice(0,14))+' ☠ '+String(d.vn||'?').slice(0,14),e:Date.now()+6000});if(d.kp&&d.kp===myPeer)me.k++}
function die(by){me.al=false;me.hp=0;snd('die');const k=others.get(by);kill({kp:by,kn:k?k.n:'',vn:pname})}
function dmg(d,by){if(!me.al)return;snd('hit');me.hf=performance.now();const s=Math.min(me.sh,d);me.sh-=s;me.hp-=d-s;if(me.hp<=0)die(by)}
function pick(l){const t=l.t;snd(t==='med'||t==='shield'?'heal':'pick');
 if(t==='ammo')me.am=Math.min(200,me.am+25);else if(t==='med')me.med=Math.min(5,me.med+1);else if(t==='shield')me.sh=Math.min(100,me.sh+50);
 else{if(!me.own[t])me.w=t;me.own[t]=1;me.am=Math.min(200,me.am+15)}
 taken.add(l.i);if(room)room.emit('pick',{i:l.i,rd:RD}).catch(()=>{})}

function sync(list){const ids=new Set();
 for(const p of list){if(p.sameTab){myPeer=p.peer;continue}if(p.kind!=='viewer')continue;const s=p.presence;if(!s||typeof s.x!=='number')continue;
  const o=others.get(p.peer)||{x:s.x,y:s.y};ids.add(p.peer);
  Object.assign(o,{tx:s.x,ty:s.y,a:+s.a||0,hp:+s.hp||0,al:!!s.al,n:String(s.n||'?').slice(0,14),c:+s.c||0,w:WP[s.w]?s.w:'pistol',k:+s.k||0});others.set(p.peer,o)}
 for(const k of [...others.keys()])if(!others.get(k).bot&&!ids.has(k))others.delete(k)}
async function net(){
 try{const R=window.claude&&await claude.use('room');if(!R)throw 0;let rm=null;
  for(let i=1;i<=12&&!rm;i++){const x=await R.join('arena-'+i);await new Promise(r=>setTimeout(r,800));if(x.peers().length<=10){rm=x;arena=i}else await x.leave()}
  if(!rm)throw 0;room=rm;mode='o';for(const k of [...others.keys()])if(others.get(k).bot)others.delete(k);
  room.onPeers(c=>sync(c.peers),()=>{});sync(room.peers());
  room.on('shot',m=>{if(m.isMe||!m.data)return;const d=m.data;spawn(d.x,d.y,d.as,d.w,m.peer)});
  room.on('kill',m=>onKill(m.data||{}));
  room.on('pick',m=>{const d=m.data||{};if(!m.isMe&&d.rd===RD)taken.add(d.i)});
 }catch(e){room=null;mode='b';mkBots()}}

function upd(dt){
 const r=Math.floor(Date.now()/RL);if(r!==RD){RD=r;gen(r);reset();for(const k of [...others.keys()])if(others.get(k).bot)others.delete(k);if(mode==='b')mkBots()}
 const t=(Date.now()%RL)/1000;
 if(me.al){
  const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy),sp=235*dt/l;const nx=Math.max(18,Math.min(W-18,me.x+dx*sp)),ny=Math.max(18,Math.min(W-18,me.y+dy*sp));
   if(!hitObs(nx,me.y,16))me.x=nx;if(!hitObs(me.x,ny,16))me.y=ny}
  me.a=Math.atan2(mouse.y-VH/2,mouse.x-VW/2);cd-=dt;
  if(me.am<6)me.am=Math.min(6,me.am+dt*.5);
  if(mouse.d&&cd<=0){if(me.am>=1)shoot();else{cd=.3;snd('click')}}
  for(const l of loot)if(!taken.has(l.i)&&Math.hypot(l.x-me.x,l.y-me.y)<38)pick(l);
  if(Math.hypot(me.x-C,me.y-C)>zoneR(t)){me.hp-=dt*(2+t/25);if(me.hp<=0)die(null)}
 }
 for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;let dead=b.l<=0||hitObs(b.x,b.y,2);
  if(!dead){
   if(b.o!=='me'){if(me.al&&Math.hypot(b.x-me.x,b.y-me.y)<18){dmg(b.d,b.o);dead=true}}
   else for(const o of others.values())if(o.al&&Math.hypot(b.x-o.x,b.y-o.y)<18){
    if(o.bot){o.hp-=b.d;if(o.hp<=0){o.al=false;me.k++;feed.push({t:pname+' ☠ '+o.n,e:Date.now()+6000})}}dead=true;break}}
  if(dead)bul.splice(i,1)}
 for(const [id,o] of others){
  if(!o.bot){if(o.tx!=null){const f=Math.min(1,dt*12);o.x+=(o.tx-o.x)*f;o.y+=(o.ty-o.y)*f}continue}
  if(!o.al)continue;const ex=me.x-o.x,ey=me.y-o.y,d=Math.hypot(ex,ey),see=me.al&&d<520;
  if(see){o.a=Math.atan2(ey,ex);o.cd-=dt;if(o.cd<=0){o.cd=.8+Math.random()*.5;spawn(o.x+Math.cos(o.a)*24,o.y+Math.sin(o.a)*24,[o.a+(Math.random()-.5)*.35],'pistol',id)}}
  if(Math.hypot(o.gx-o.x,o.gy-o.y)<30||Math.random()<.003){const R=Math.max(80,zoneR(t)*.8),q=Math.random()*6.28,rr=Math.random()*R;o.gx=C+Math.cos(q)*rr;o.gy=C+Math.sin(q)*rr}
  const tx=see&&d>220?me.x:o.gx,ty=see&&d>220?me.y:o.gy,a=Math.atan2(ty-o.y,tx-o.x),nx=o.x+Math.cos(a)*105*dt,ny=o.y+Math.sin(a)*105*dt;
  if(!see)o.a=a;if(!hitObs(nx,o.y,18))o.x=nx;else o.gx=Math.random()*W;if(!hitObs(o.x,ny,18))o.y=ny;else o.gy=Math.random()*W}
 if(room&&performance.now()-lastPres>80){lastPres=performance.now();
  room.presence({x:Math.round(me.x),y:Math.round(me.y),a:+me.a.toFixed(2),hp:Math.round(me.hp),al:me.al,n:pname,c:hue,w:me.w,k:me.k}).catch(()=>{})}
}

// ---- audio (synthesized, no files) ----
let AC=null,mute=false;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function nz(d,f,v){const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),G=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f;G.gain.value=v;s.connect(fl);fl.connect(G);G.connect(AC.destination);s.start()}
function tn(f1,f2,d,v,ty){const o=AC.createOscillator(),G=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);G.gain.setValueAtTime(v,t);G.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(G);G.connect(AC.destination);o.start(t);o.stop(t+d)}
function snd(k,x,y){if(mute||!AC)return;let v=1;if(x!=null){v=1-Math.hypot(x-me.x,y-me.y)/900;if(v<.05)return}
 if(k==='pistol'){nz(.14,3800,.5*v);tn(190,50,.12,.45*v,'square')}
 else if(k==='smg'){nz(.07,5000,.35*v);tn(240,70,.07,.28*v,'square')}
 else if(k==='shotgun'){nz(.4,1800,.9*v);tn(120,35,.3,.8*v,'sawtooth')}
 else if(k==='rifle'){nz(.26,2800,.75*v);tn(160,40,.22,.65*v,'sawtooth')}
 else if(k==='hit'){nz(.1,1400,.5);tn(320,70,.18,.45,'sawtooth')}
 else if(k==='pick'){tn(700,1300,.1,.22,'triangle')}
 else if(k==='heal'){tn(520,1040,.12,.25);setTimeout(()=>{if(AC)tn(780,1560,.18,.22)},110)}
 else if(k==='die'){tn(220,35,.8,.5,'sawtooth');nz(.5,600,.5)}
 else if(k==='click'){tn(1000,600,.03,.2,'square')}}
// ---- procedural sprites (pre-rendered) ----
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),c);return c};
const rg=(x,cx,cy,r,a,b)=>{const q=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);q.addColorStop(0,a);q.addColorStop(1,b);return q};
function gun(x,w){x.save();x.translate(0,32);
 if(w==='pistol'){x.fillStyle='#1d1f23';x.fillRect(48,-3,17,6);x.fillStyle='#4a4f57';x.fillRect(48,-3,17,2)}
 else if(w==='smg'){x.fillStyle='#262a30';x.fillRect(44,-4,30,8);x.fillStyle='#14161a';x.fillRect(56,3,5,10);x.fillRect(74,-2,7,4);x.fillStyle='#5b6370';x.fillRect(44,-4,30,2)}
 else if(w==='shotgun'){x.fillStyle='#6b4423';x.fillRect(40,-4,20,8);x.fillStyle='#8a5a2e';x.fillRect(40,-4,20,2);x.fillStyle='#24262a';x.fillRect(58,-3,38,6);x.fillStyle='#5b6370';x.fillRect(58,-3,38,2);x.fillStyle='#7a4e28';x.fillRect(68,2,16,4)}
 else{x.fillStyle='#2b3527';x.fillRect(36,-4,36,8);x.fillStyle='#16181b';x.fillRect(72,-2,26,4);x.fillStyle='#0e0f11';x.fillRect(50,-9,12,5);x.fillRect(58,4,5,10);x.fillStyle='#55624f';x.fillRect(36,-4,36,2)}
 x.restore()}
const PC={};
function sprite(h,w){const k=h+w;return PC[k]||(PC[k]=mk(100,64,x=>{
 const cl='hsl('+h+',42%,34%)',dk='hsl('+h+',40%,20%)';
 x.fillStyle=dk;x.beginPath();x.roundRect(12,22,14,20,5);x.fill();
 x.fillStyle=rg(x,32,32,18,'hsl('+h+',45%,46%)',dk);x.beginPath();x.ellipse(32,32,10,19,0,0,7);x.fill();
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(31,17,3,30);x.fillStyle='rgba(255,255,255,.1)';x.fillRect(25,22,4,20);
 x.lineCap='round';x.strokeStyle=cl;x.lineWidth=8;x.beginPath();x.moveTo(30,43);x.lineTo(52,35);x.moveTo(30,21);x.lineTo(60,30);x.stroke();
 gun(x,w);x.fillStyle='#d9a67a';for(const q of [[53,35],[61,30]]){x.beginPath();x.arc(q[0],q[1],4.5,0,7);x.fill()}
 x.fillStyle=rg(x,31,32,10,'hsl('+h+',30%,48%)','hsl('+h+',35%,16%)');x.beginPath();x.arc(31,32,10,0,7);x.fill();x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=1.5;x.stroke();
 x.fillStyle='rgba(15,18,22,.85)';x.fillRect(36,27,3,10)}))}
const TR=[],RK=[];
for(let v=0;v<3;v++){const q=rng(v+5);
 TR.push(mk(160,160,x=>{x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(88,92,62,0,7);x.fill();
  for(let i=0;i<14;i++){const a=q()*6.28,d=q()*38,r=24+q()*14,cx=80+Math.cos(a)*d,cy=80+Math.sin(a)*d,l=18+q()*14;
   x.fillStyle=rg(x,cx,cy,r,'hsl('+(105+q()*25)+',50%,'+(l+14)+'%)','hsl(120,50%,'+(l-6)+'%)');x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}}));
 RK.push(mk(160,160,x=>{x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(88,92,56,50,0,0,7);x.fill();
  const P=[];for(let i=0;i<10;i++){const a=i/10*6.28,r=48+q()*20;P.push([80+Math.cos(a)*r,80+Math.sin(a)*r])}
  const poly=(sc,f)=>{x.fillStyle=f;x.beginPath();P.forEach((p,i)=>x[i?'lineTo':'moveTo'](80+(p[0]-80)*sc,80+(p[1]-80)*sc));x.closePath();x.fill()};
  poly(1,rg(x,80,80,70,'#9a9fa6','#4d5157'));x.strokeStyle='#33363a';x.lineWidth=3;x.stroke();poly(.6,rg(x,70,70,45,'#b7bcc2','#6b7078'));
  x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=2;x.beginPath();x.moveTo(60,70);x.lineTo(85,85);x.lineTo(100,110);x.stroke()}))}
const icon={ammo:x=>{x.fillStyle=rg(x,32,22,18,'#8a7a3a','#4a3f1a');x.beginPath();x.roundRect(16,12,32,18,3);x.fill();x.strokeStyle='#2a2410';x.lineWidth=2;x.stroke();
  for(let i=0;i<5;i++){x.fillStyle='#e0b43a';x.fillRect(20+i*5.5,15,3.5,10);x.fillStyle='#b5651d';x.fillRect(20+i*5.5,15,3.5,3)}},
 med:x=>{x.fillStyle=rg(x,32,20,20,'#fff','#c9ced4');x.beginPath();x.roundRect(17,6,30,26,5);x.fill();x.strokeStyle='#8a8f96';x.lineWidth=2;x.stroke();x.fillStyle='#d62828';x.fillRect(29,10,6,18);x.fillRect(23,16,18,6)},
 shield:x=>{x.fillStyle=rg(x,32,18,22,'#8fd3ff','#1d5fa8');x.beginPath();x.moveTo(32,4);x.lineTo(48,10);x.lineTo(46,24);x.quadraticCurveTo(40,32,32,36);x.quadraticCurveTo(24,32,18,24);x.lineTo(16,10);x.closePath();x.fill();x.strokeStyle='#0d3a6b';x.lineWidth=2;x.stroke();x.fillStyle='rgba(255,255,255,.35)';x.fillRect(30,9,4,22)}};
for(const k of ORD.slice(1))icon[k]=x=>{x.save();x.translate(-34,-12);gun(x,k);x.restore()};
const LSP={};for(const k in icon)LSP[k]=mk(64,40,icon[k]);
const GRASS=g.createPattern(mk(256,256,x=>{x.fillStyle='#2c4a2c';x.fillRect(0,0,256,256);const q=rng(99);for(let i=0;i<2600;i++){x.fillStyle='hsla('+(95+q()*40)+',45%,'+(18+q()*14)+'%,'+(.25+q()*.4)+')';const s=1+q()*3;x.fillRect(q()*256,q()*256,s,s*2.2)}}),'repeat');
function dp(x,y,a,h,n,hp,w,f){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x+4,y+6,19,15,0,0,7);g.fill();
 g.save();g.translate(x,y);g.rotate(a);g.drawImage(sprite(h,w),-32,-32);
 if(f&&performance.now()-f<70){const L=(w==='pistol'?64:w==='smg'?80:96)-32;g.fillStyle='rgba(255,210,90,.95)';g.beginPath();g.moveTo(L,0);g.lineTo(L+10,-8);g.lineTo(L+22,0);g.lineTo(L+10,8);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(L+6,0,4,0,7);g.fill()}
 g.restore();T(n,x,y-34,13,'center');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x-21,y-29,42,6);g.fillStyle=hp>50?'#4d4':hp>25?'#fb3':'#f44';g.fillRect(x-20,y-28,40*Math.max(0,hp)/100,4)}
function T(s,x,y,sz,al,col){g.font='bold '+sz+'px system-ui,sans-serif';g.textAlign=al||'left';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
